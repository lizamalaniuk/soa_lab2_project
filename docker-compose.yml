services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [users, homework, notifications]

  users:
    build: ./services
    command: uvicorn users:app --host 0.0.0.0 --port 8000
    depends_on:
      redis: {condition: service_healthy}

  homework:
    build: ./services
    command: uvicorn homework:app --host 0.0.0.0 --port 8000
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      users: {condition: service_started}

  notifications:
    build: ./services
    command: uvicorn notifications:app --host 0.0.0.0 --port 8000
    depends_on:
      redis: {condition: service_healthy}

  consumer:
    build: ./services
    command: python consumer.py
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20
